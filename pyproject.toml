[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "launch-feed"
version = "0.1.0"
description = "Builds the LaunchClock launch feed from The Space Devs Launch Library 2 and publishes it via GitHub Pages."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
