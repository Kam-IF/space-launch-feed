# 打ち上げフィード（v1/launches.json と index.html）を生成し、GitHub Pages に公開する。
# 主な起動は外部（cron-job.org）からの 15 分ごとの workflow_dispatch（README「External trigger」）。
# GitHub の schedule はまれにしか動かなかったため（2026-10-13 実測: 15 分ごとの設定で 4 時間以上動かない）、
# 6 時間ごとの予備としてだけ残す。
# 前回の生成から 10 分たっていない起動は guard ジョブが飛ばす（外部の起動の設定ミス・大量の呼び出しへの対策。
# Launch Library 2 の無料枠 1 時間 15 回を守る）。手動で強制するときは force を ON にする。
# 生成に失敗した場合は artifact が作られず deploy もスキップされるため、前回の公開がそのまま残る。
# 事前設定: リポジトリの Settings > Pages > Source を「GitHub Actions」にする必要がある。
name: publish-feed

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      endpoint:
        description: 'Launch Library 2 のエンドポイント'
        type: choice
        options:
          - prod
          - dev
        default: prod
      force:
        description: '前回の生成から 10 分以内でも生成する'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 前回の生成から 10 分以内なら build と deploy を飛ばす。判定できないときも飛ばす（src/launch_feed/run_guard.py）。
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      build: ${{ steps.guard.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install .
      - id: guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: |
          if [ "${FORCE}" = "true" ]; then
            echo "guard: forced"
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            python -m launch_feed guard \
              --repo "${GITHUB_REPOSITORY}" --workflow publish-feed.yml \
              --run-id "${GITHUB_RUN_ID}" --min-interval 600
          fi

  build:
    needs: guard
    if: needs.guard.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Build feed
        env:
          # schedule 時は inputs が空なので prod にする。式は run に直接埋め込まず env 経由で渡す。
          ENDPOINT: ${{ github.event_name == 'workflow_dispatch' && inputs.endpoint || 'prod' }}
          LL2_API_KEY: ${{ secrets.LL2_API_KEY }}
        run: python -m launch_feed build --out _site --endpoint "${ENDPOINT}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # 60 日間の無活動による schedule 停止への対策。
  # 実行のたびに workflow を enable する（無効化されると外部からの workflow_dispatch も失敗するため、手動・外部の起動でも行う）。これで 60 日タイマーがリセットされる公式保証はない。
  # README の 50 日ごとの確認を必須の運用とする。
  # 失敗時は ::warning:: 注釈を出してこのジョブだけ失敗させる。continue-on-error により
  # ワークフロー全体は失敗扱いにならない。build の成否とは独立に動く（needs を付けない）。
  keepalive:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Enable workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh workflow enable publish-feed.yml -R "$GITHUB_REPOSITORY"; then
            echo "::warning title=keepalive failed::gh workflow enable failed. Check that the schedule is still running (see README)."
            exit 1
          fi
